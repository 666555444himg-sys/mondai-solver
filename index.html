<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="問題ソルバー">
<title>問題ソルバー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://generativelanguage.googleapis.com">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>📷 問題ソルバー</h1>
  <span class="spacer"></span>
  <span class="sheet-badge" id="sheetBadge" hidden></span>
  <button id="settingsBtn" aria-label="設定">⚙</button>
</header>

<section class="card setup" id="setup" hidden>
  <h2>設定</h2>
  <label class="field">Gemini API キー
    <input id="keyInput" type="password" placeholder="AI Studio で作ったキーを貼り付け" autocomplete="off">
  </label>
  <p class="hint"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> で無料で作れます (カード登録不要)。キーはこのスマホの中にだけ保存されます。</p>
  <label class="field">解答シート (Google スプレッドシートの URL・任意)
    <input id="sheetUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" autocomplete="off">
  </label>
  <p class="hint">1行目に「問題」「答え」などの見出しを付けてください。スマホから読むには、シートの共有を「リンクを知っている全員 (閲覧者)」にする必要があります。</p>
  <p class="status" id="sheetStatus"></p>
  <div class="row">
    <label class="check"><input type="checkbox" id="flashOnly" checked> Flash 固定 (混雑しても別モデルにしない)</label>
  </div>
  <div class="row">
    <button id="sheetReload">シートを再読み込み</button>
    <span class="spacer"></span>
    <button id="saveBtn" class="primary">保存</button>
  </div>
</section>

<main>
  <div class="actions">
    <label class="big primary">📷 撮影して解く<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden></label>
    <label class="big">🖼 写真を選ぶ<input type="file" id="photoInput" accept="image/*" hidden></label>
  </div>
  <div class="row options">
    <select id="speed" aria-label="速さと正確さ">
      <option value="fastest">⚡ 最速</option>
      <option value="fast">速い</option>
      <option value="accurate" selected>正確 (深く考える)</option>
      <option value="max">最高精度 (3回解いて多数決)</option>
    </select>
    <label class="check" title="知識問題を Google 検索で確かめてから答えます"><input type="checkbox" id="search"> 🔍 検索</label>
  </div>

  <section class="card answer">
    <div class="status" id="status">問題を撮影してください。</div>
    <div class="photo" id="photoBox" hidden>
      <img id="photoThumb" alt="撮影した問題">
      <button id="cropBtn">✂ 範囲を選んで解き直す</button>
    </div>
    <div class="final" id="final"></div>
    <div class="compare" id="compare" hidden>
      <div class="cell"><div class="label">🤖 Gemini の答え</div><div class="val" id="valGemini"></div></div>
      <div class="cell sheet-cell"><div class="label">📊 解答シートの答え</div><div class="val" id="valSheet"></div></div>
      <div class="verdict" id="verdict"></div>
    </div>
    <div class="explain" id="explain"></div>
    <button id="stopBtn" hidden>■ 停止</button>
  </section>

  <section class="card composer">
    <textarea id="text" rows="2" placeholder="問題文を入力して解くこともできます"></textarea>
    <div class="row">
      <span class="spacer"></span>
      <button id="sendBtn">送信</button>
    </div>
  </section>

  <section class="history">
    <h2>履歴</h2>
    <ol id="history"></ol>
  </section>
</main>

<div class="modal" id="cropModal" hidden>
  <div class="modal-inner">
    <p>解きたい問題を指でなぞって囲んでください。</p>
    <div class="crop-stage" id="cropStage">
      <img id="cropImg" alt="">
      <div class="crop-rect" id="cropRect" hidden></div>
    </div>
    <div class="row">
      <button id="cropCancel">やめる</button>
      <span class="spacer"></span>
      <button id="cropDone" class="primary">この範囲で解く</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
